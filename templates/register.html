{% extends "base.html" %}
{% block content %}

<h1 class="page-title">Create Your Account</h1>

<div class="card" style="max-width: 480px; margin: auto;">
    <h2>Begin Your Secure Journey</h2>
    <p class="intro">
        Establish your workspace and start building sovereign, compliant cyber readiness.
    </p>

    <form action="/register" method="POST">

        <label>Full Name</label>
        <input type="text" name="full_name" class="input-field" required>

        <label>Email Address</label>
        <input type="email" name="email" class="input-field" required>

        <label>Username</label>
        <input type="text" name="username" class="input-field" required>

        <label>Password</label>
        <input type="password" name="password" class="input-field" required>

        <label>Confirm Password</label>
        <input type="password" name="confirm_password" class="input-field" required>

        <button class="btn-primary" type="submit">Create Account</button>
    </form>

    <p style="margin-top: 1rem; text-align: center;">
        Already have an account?
        <a href="/login" class="link">Sign In</a>
    </p>
</div>

{% endblock %}
